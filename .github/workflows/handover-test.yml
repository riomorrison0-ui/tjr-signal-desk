name: Handover test
on:
  workflow_dispatch:
    inputs:
      stage:
        default: "ping"
permissions:
  actions: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "stage=${{ inputs.stage }}"
          if [ "${{ inputs.stage }}" = "ping" ]; then
            curl -s -o /dev/null -w "dispatch %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/handover-test.yml/dispatches \
              -d '{"ref":"main","inputs":{"stage":"pong"}}'
          fi
