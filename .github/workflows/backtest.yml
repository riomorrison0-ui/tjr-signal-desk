name: Gold backtest

on:
  workflow_dispatch:
    inputs:
      from:
        description: "History start (yyyy-mm-dd)"
        default: "2022-01-01"
      oos_start:
        description: "Out-of-sample starts (yyyy-mm-dd)"
        default: "2025-01-01"
      quick:
        description: "Only run the first N combinations (blank = all)"
        default: ""
  schedule:
    - cron: "17 6 * * 6"   # Saturday morning: refresh the numbers weekly

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Restore downloaded history
        uses: actions/cache@v4
        with:
          path: .dkcache
          key: dukascopy-xauusd-${{ github.run_id }}
          restore-keys: dukascopy-xauusd-
      - name: Download spot XAUUSD 5m history (Dukascopy, free)
        run: |
          mkdir -p data/hist
          npx --yes dukascopy-node@1.51.0 -i xauusd -from "${{ inputs.from || '2022-01-01' }}" -to now \
            -t m5 -f csv -p bid -dir data/hist -fn xauusd_m5 -ch -chpath .dkcache -bs 10 -bp 500 -s \
            || npx --yes dukascopy-node@1.51.0 -i xauusd -from "${{ inputs.from || '2022-01-01' }}" -to now \
            -t m5 -f csv -p bid -dir data/hist -fn xauusd_m5 -ch -chpath .dkcache -bs 5 -bp 2000 -d
          ls -la data/hist; head -3 data/hist/*.csv; wc -l data/hist/*.csv
      - name: Run backtest
        env:
          OOS_START: ${{ inputs.oos_start || '2025-01-01' }}
          QUICK: ${{ inputs.quick }}
        run: python scanner/backtest.py
      - name: Save report
        run: |
          git config user.name "gold-desk-bot"
          git config user.email "gold-desk-bot@users.noreply.github.com"
          git add reports
          git commit -m "backtest $(date -u +%F)" -q || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
