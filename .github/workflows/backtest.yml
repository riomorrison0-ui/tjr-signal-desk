name: Gold backtest

on:
  workflow_dispatch:
    inputs:
      from:
        description: "History start (yyyy-mm-dd)"
        default: "2019-11-01"
      oos_start:
        description: "Out-of-sample starts (yyyy-mm-dd)"
        default: "2025-01-01"
      strats:
        description: "Only these strategies, comma separated (blank = all)"
        default: ""
      accounts:
        description: "Account sizes in GBP"
        default: "200,1000,2000"
      tag:
        description: "Save results under reports/<tag>"
        default: ""
      quick:
        description: "Only run the first N combinations (blank = all)"
        default: ""
  schedule:
    - cron: "17 6 * * 6"   # Saturday morning: refresh the numbers weekly

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Download 5m gold history (free)
        run: |
          python -u scanner/history.py "${{ inputs.from || '2019-11-01' }}"
          cat data/hist/source.txt; echo; wc -l data/hist/xauusd_m5.csv; head -3 data/hist/xauusd_m5.csv
      - name: Run backtest
        env:
          OOS_START: ${{ inputs.oos_start || '2025-01-01' }}
          QUICK: ${{ inputs.quick }}
          STRATS: ${{ inputs.strats }}
          REPORT_TAG: ${{ inputs.tag }}
          ACCOUNTS: ${{ inputs.accounts || '200,1000,2000' }}
        run: python -u scanner/backtest.py
      - name: Save report
        run: |
          git config user.name "gold-desk-bot"
          git config user.email "gold-desk-bot@users.noreply.github.com"
          git add reports
          git commit -m "backtest $(date -u +%F)" -q || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && break; sleep $((RANDOM % 20 + 5)); done
