name: Gold scanner (live)

# One job runs ~5h45m and checks gold at every 5-minute candle close, then dispatches the next job.
# The 30-minute cron is only a safety net: if the chain ever breaks, it restarts within 30 minutes.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Send the full self-test pack to Telegram"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Watch gold (every candle close)
        env:
          LOOP: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          SELFTEST: ${{ inputs.selftest && '1' || '' }}
        run: python -u scanner/live.py
